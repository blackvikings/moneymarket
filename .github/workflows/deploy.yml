name: Deploy Laravel App

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo SSH SUCCESS"

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

          echo "Go to project"
          cd /var/www/money-market

          echo "Fix git safe directory"
          git config --global --add safe.directory /var/www/money-market

          echo "Pull latest code"
          git pull origin master

          echo "Install PHP dependencies"
          composer install --no-dev --optimize-autoloader

          echo "Fix permissions"
          chown -R devops:www-data storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache

          echo "Laravel cleanup"
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan route:clear

          echo "Run migrations"
          php artisan migrate --force

          echo "Seed (optional)"
          php artisan db:seed --force || true

          echo "Install Node dependencies"
          npm install

          echo "Build frontend"
          npm run build

          echo "Cache for production"
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "Restart services"
          sudo systemctl restart php8.2-fpm
          sudo systemctl restart nginx

          echo "Deployment completed"

          EOF
