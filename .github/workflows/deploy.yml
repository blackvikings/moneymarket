- name: Test SSH
  run: |
    ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo SSH SUCCESS"


name: Redeploy Money Market

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          
          echo "Going to project folder"
          cd ${{ secrets.PROJECT_PATH }}

          echo "Pull latest code"
          git pull origin master

          echo "Install PHP dependencies"
          composer install --no-dev --optimize-autoloader

          echo "Fix permissions"
          sudo chown -R www-data:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache

          echo "Laravel optimize"
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan route:clear

          echo "Run migrations"
          php artisan migrate --force

          echo "Seed (optional)"
          php artisan db:seed --force || false

          echo "Install Node deps & build"
          npm install
          npm run build

          echo "Cache for production"
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "Restart services"
          sudo systemctl restart php8.2-fpm
          sudo systemctl restart nginx

          echo "Deployment finished"

          EOF
